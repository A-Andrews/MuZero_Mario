defaults:
  - env: mario
  - model: muzero_mario_small
  - _self_

seed: 2024
device: cuda

# Stable name for resume-friendly runs. When set:
#   - the submission scripts pin hydra.run.dir = outputs/runs/${run_name}
#   - train_muzero.py auto-resumes from outputs/runs/${run_name}/checkpoints/latest.pt
#     if it exists (no need to pass resume.path)
#   - wandb run uses this name as a stable id with resume="allow"
# Leave null for one-shot runs that should NOT resume.
run_name: null

training:
  total_env_steps: 1_000_000
  batch_size: 128
  # LR schedule: linear warmup over lr_warmup_steps, cosine decay from lr to
  # lr_min over lr_decay_steps, then constant at lr_min. (The old StepLR
  # x lr_decay_factor schedule decayed to ~1e-9 on long runs and froze
  # learning — do not reintroduce it.)
  lr: 1.0e-3
  lr_min: 1.0e-4
  lr_warmup_steps: 1_000
  # Size lr_decay_steps to the run's realistic gradient-step count, not its
  # env-step budget: at the observed ~0.035-0.05 train/env ratio a 10M-env-step
  # run only reaches ~400-500K train steps. The old 1.5M default meant the LR
  # effectively never decayed (still 8e-4 at run end) — level1-1-diag-v1's
  # late-run completion collapse (0.72 -> ~0.15 with rising value loss)
  # happened under that permanently-high LR.
  lr_decay_steps: 400_000
  weight_decay: 1.0e-4
  grad_clip: 5.0
  min_replay_transitions: 10_000
  # Max gradient steps per collected env step (<=0 disables). Caps the replay
  # ratio (effective samples/transition = ratio * batch_size) and stops the
  # learner from starving the inference server of GPU when self-play is the
  # bottleneck.
  max_train_per_env_step: 0.3
  weight_broadcast_every: 100
  # Sync cadence (train steps) of the lagged target net used for reanalyzed
  # value bootstraps (muzero.reanalyze).
  target_update_every: 200
  save_every_train_steps: 5_000
  # A replay rollout is a full greedy-MCTS episode on the GPU and contends
  # with the learner, so it runs on its own (sparser) cadence rather than
  # every checkpoint. <=0 falls back to save_every_train_steps.
  replay_every_train_steps: 50_000
  # Step cap per replay-eval episode (<=0 falls back to
  # selfplay.max_trajectory_length). Keeps the 12-level greedy-MCTS video
  # sweep from monopolising the GPU between checkpoints.
  replay_max_steps: 2_000
  log_every_train_steps: 100

muzero:
  unroll_K: 5
  n_step: 10
  discount: 0.997
  # Support grids live in *transformed* (signed_hyperbolic) space; model
  # configs interpolate these values so head sizes always match the loss.
  # ±25 transformed ≈ ±640 raw return units and ±8 transformed ≈ ±79 raw
  # reward units — generous headroom for Mario (per-step reward ≤ ~27 even
  # with completion_bonus 200) at ~25x finer bin resolution than the old
  # Atari-sized ±300 grid, of which Mario ever used ~25 of 601 bins.
  value_support_min: -25
  value_support_max: 25
  value_support_size: 201
  reward_support_min: -8
  reward_support_max: 8
  reward_support_size: 81
  loss_weight_value: 1.0
  loss_weight_reward: 1.0
  loss_weight_policy: 1.0
  # EfficientZero-style self-supervised consistency loss (SimSiam projector;
  # dynamics hidden state pulled toward the stop-grad representation of the
  # real next observation). 0 disables. Big sample-efficiency win when
  # env steps, not gradient steps, are the bottleneck.
  loss_weight_consistency: 2.0
  # Value reanalyze (EfficientZero-style): recompute n-step value targets at
  # sample time by bootstrapping from a lagged copy of the online network,
  # instead of the MCTS root values frozen at collection time. With the
  # ~38x replay ratio those stored bootstraps go stale fast; this keeps value
  # targets tracking the current network. Costs one extra no-grad
  # representation forward per unroll position (B*(K+1) obs per batch).
  reanalyze: true

mcts:
  num_simulations: 32
  # Leaves selected (with virtual visits) and evaluated per inference round
  # trip. 1 = fully sequential (paper) search; 4 cuts the synchronous server
  # round trips per env step from 33 to 9 at a small search-quality cost for
  # 32-sim trees — the workers' env-steps/s scale almost directly with this.
  leaf_batch: 4
  pb_c_base: 19652
  pb_c_init: 1.25
  dirichlet_alpha: 0.25
  root_exploration_eps: 0.25

buffer:
  capacity_transitions: 300_000
  priority_alpha: 1.0
  priority_beta_start: 0.4
  priority_beta_end: 1.0
  priority_beta_anneal_steps: 500_000
  eps_priority: 1.0e-3

# Imitation learning from converted human gameplay (the
# scripts/convert_human_bk2.py output in data_dir). Two mechanisms, both
# optional: a supervised pretrain phase (100% human batches, BC policy loss
# from the stored one-hot human actions, reanalyze off) before self-play
# starts, and a constant fraction of every RL batch drawn from a pinned
# never-evicted human buffer. Off by default; existing runs are unaffected.
# Memory: human obs are (4,96,96) uint8 = 36.9 KB/step — all subjects at the
# default 12 training levels is ~1.53M steps ≈ 56.5 GB RAM, one subject ≈ 11 GB.
imitation:
  enabled: false
  data_dir: outputs/human_trajectories
  subjects: null            # null = all subjects; or a list, e.g. [sub-01]
                            # (corpus has sub-01/02/03/05/06 — no sub-04)
  levels: match_env         # match_env | all | explicit list [Level1-1, ...]
  completed_only: false     # keep only flag-completed segments
  max_transitions: 0        # 0 = unlimited; cap loaded human transitions (RAM guard)
  holdout_fraction: 0.02    # file-level holdout for BC eval (0 disables)
  holdout_max_transitions: 4096
  pretrain_steps: 50_000    # supervised-only gradient steps before RL (0 skips)
  mix_ratio: 0.25           # constant human fraction of each RL training batch
  # Optional anneal replacing the constant: [train_step, ratio] points,
  # linearly interpolated, clamped outside the range. Steps count RL-phase
  # learner train steps (pretrain offset is applied automatically). E.g.
  # [[0, 0.25], [70_000, 0.0]] fades the human anchor out over ~2M env steps
  # at the observed ~0.035 train/env ratio. null = constant mix_ratio.
  mix_ratio_schedule: null

selfplay:
  num_workers: 20
  max_queue_size: 32
  max_trajectory_length: 5_000
  # Thresholds are learner train steps (with max_train_per_env_step=0.3 they
  # lag env steps ~3.3x).
  temperature_schedule:
    - [0, 1.0]
    - [100_000, 0.5]
    - [300_000, 0.25]

worker:
  torch_threads: 1

inference_server:
  # Device for the server's shadow network. null = auto: cuda:1 when the
  # learner is on CUDA and a second GPU is visible (submit with --gres=gpu:2),
  # so the learner no longer competes with self-play inference for one GPU;
  # otherwise the learner's device (single-GPU behavior unchanged).
  device: null
  # GPU rows per forward, not requests: a leaf-batched recurrent request
  # contributes mcts.leaf_batch rows. 20 workers x leaf_batch 4 = 80 rows in
  # flight worst-case.
  max_batch: 128
  max_wait_ms: 1.0
  use_amp: true
  # Transport dtype for hidden-state arrays over the worker<->server IPC.
  # float32 is byte-identical to the network output; float16 halves IPC
  # volume at a small precision cost (value/reward scalars stay float32).
  wire_dtype: float16
  # Pad each GPU forward to a power-of-two batch bucket so cuDNN autotunes a
  # small fixed set of shapes (cudnn.benchmark) instead of re-tuning per size.
  # Padding rows are sliced off; replies match the unpadded forward up to
  # float32 rounding (~1e-7), the real rows are mathematically unchanged.
  pad_batches: true
  # torch.compile for the server net: "off", "default", or "reduce-overhead"
  # (CUDA graphs). Server forwards are small and launch-bound, so compile can
  # help a lot — but benchmark one short run before enabling on a long chain,
  # and keep pad_batches=true so batch shapes stay on the pow-2 buckets.
  compile: "off"

# Inverse-length autocurriculum across env.levels. Workers sample the next
# level at every episode boundary from a shared weight vector; weights are
# proportional to 1/mean_episode_length^exponent so levels where episodes
# last *longer* are sampled *less*. Set enabled=false to keep the legacy
# fixed worker-to-level assignment.
autocurriculum:
  enabled: true
  history_size: 50            # episodes per level kept in the rolling window
  exponent: 1.0               # >1 sharpens curriculum, <1 softens it
  min_weight: 0.02            # floor on per-level probability after renorm
  update_every_train_steps: 200   # how often the learner pushes new weights
  warmup_episodes_per_level: 3    # keep weights uniform until every level has this many episodes

learner_torch_threads: 1

wandb:
  project: muzero-mario
  entity: null
  mode: online
  name: null          # optional run name, e.g. "tierA-bf16"
  tags: null          # optional list of tags, e.g. ["speedup","tierA"]
  notes: null         # optional free-text notes
  group: null         # optional run group (for A/B comparisons)
  job_type: null      # optional job_type, e.g. "baseline" / "experiment"
  log_videos_every_ckpt: true
  watch_model: false

resume:
  path: null
