   <g id="text_1">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="45.792" y="122.662125" transform="rotate(-0 45.792 122.662125)">Observe</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 153.107375)">RGB → grayscale + pooling</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 169.076125)">4 × 96 × 96 frame stack</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="253.152" y="122.662125" transform="rotate(-0 253.152 122.662125)">Represent: h(o)</text>
   </g>
   <g id="text_4">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(253.152 154.076125)">Encode the real observation</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(253.152 168.107375)">as a compact hidden state</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="474.336" y="122.662125" transform="rotate(-0 474.336 122.662125)">Predict: f(s)</text>
   </g>
   <g id="text_6">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(474.336 153.107375)">Policy: prior over 12 actions</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(474.336 168.107375)">Value: expected future return</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="474.336" y="261.190125" transform="rotate(-0 474.336 261.190125)">Imagine: g(s, a)</text>
   </g>
   <g id="text_8">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(474.336 292.604125)">Next hidden state + reward</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(474.336 306.635375)">Repeat prediction at new state</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="723.168" y="122.662125" transform="rotate(-0 723.168 122.662125)">Search + act</text>
   </g>
   <g id="text_10">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(723.168 153.107375)">MCTS combines priors, rewards, values</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(723.168 168.107375)">Visits → greedy or sampled action</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(723.168 183.107375)">Execute 4 frames; observe again</text>
   </g>
