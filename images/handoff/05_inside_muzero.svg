   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="45.792" y="261.190125" transform="rotate(-0 45.792 261.190125)">Learn from replay</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 291.635375)">Search visits teach policy; rewards and returns teach predictions.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 306.635375)">Five recurrent training steps + latent consistency loss.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 322.604125)">Selected runs also learn from human demonstrations.</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="45.792" y="391.726125" transform="rotate(-0 45.792 391.726125)">Observed: action selection</text>
   </g>
   <g id="text_15">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 422.171375)">Greedy can repeat an unhelpful action.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 437.171375)">Targeted sampling releases many stalls.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(45.792 452.171375)">Extra RAM input belongs to that controller.</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="384.48" y="391.726125" transform="rotate(-0 384.48 391.726125)">Observed: sequence sensitivity</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(384.48 422.171375)">A useful initial jump can be abandoned.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(384.48 437.171375)">Holding it rescues some tested roots,</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(384.48 453.140125)">but harms successful references.</text>
   </g>
   <g id="text_18">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start" x="723.168" y="391.726125" transform="rotate(-0 723.168 391.726125)">Open cause: learned evaluation</text>
   </g>
   <g id="text_19">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(723.168 422.171375)">Imagined and observed values disagree.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(723.168 437.171375)">Observed values can also misjudge returns.</text>
    <text style="font-size: 10px; font-family: 'DejaVu Sans'" transform="translate(723.168 453.140125)">Leaf substitution has selective effects.</text>
   </g>
  </g>
  <g id="text_20">
   <text style="font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start" x="43.2" y="25.957031" transform="rotate(-0 43.2 25.957031)">What MuZero does at each decision — and where failures can arise</text>
  </g>
  <g id="text_21">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465365" transform="translate(37.8 542.69209)">Conceptual map, not a measured attribution diagram. MuZero predicts task-relevant latent states, not future screenshots.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465365" transform="translate(37.8 553.494551)">The benchmark uses 50 simulations with leaf batch 4. The network is reused after every real action; search does not commit to a whole plan.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465365" transform="translate(37.8 564.297012)">Read docs/handoff/REPORT.md for evidence strength, human comparison limits and the next discriminating experiments.</text>
  </g>
 </g>
 <defs>
