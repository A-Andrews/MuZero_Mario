  <g id="text_20">
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465365" transform="translate(30.24 344.11609)">Development evidence, fixed checkpoints: 203/630 (32.2%) greedy versus 202/630 (32.1%) sampled completions.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465365" transform="translate(30.24 354.918551)">Equal attempts per level; no claim of universal controller superiority. Level5-3 is missing; 2-2/7-2 are excluded for absent human data.</text>
   <text style="font-size: 9px; font-family: 'DejaVu Sans'; fill: #465365" transform="translate(30.24 365.721012)">These totals intentionally differ from the historical 22-model-level report, which included 2-2.</text>
